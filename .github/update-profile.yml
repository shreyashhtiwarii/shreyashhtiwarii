name: Update GitHub Profile

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Fetch GitHub activity
        run: |
          python scripts/fetch_activity.py

      - name: Generate activity dashboard
        run: |
          python scripts/make_activity_dashboard.py

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update GitHub activity [skip ci]"
          file_pattern: "data/contributions.json assets/activity-dashboard.svg"